pluginVersion=1.0

# The IntelliJ Platform ships its own Kotlin stdlib; do not add it again.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

# Optional: skip the platform download by pointing at a local IDE install.
# Do NOT set it here (the path is machine-specific and this file is committed).
# Put it in ~/.gradle/gradle.properties instead:
#     localIdePath=/Applications/IntelliJ IDEA.app
